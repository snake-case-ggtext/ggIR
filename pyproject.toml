[project]
name = "ggir"
version = "0.3.0"
description = "A markdown/HTML/CSS intermediate representation for rich text in plots"
readme = "README.md"
authors = [
    { name = "Tyler Riccio", email = "tylerriccio8@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "html", "css", "rich text", "ggtext", "matplotlib", "plotnine"]
dependencies = [
    "markdown-it-py>=3.0",
]

[project.urls]
Repository = "https://github.com/snake-case-ggtext/ggIR"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
